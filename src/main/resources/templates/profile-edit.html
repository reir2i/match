<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>프로필 수정 | 팀 프로젝트 매칭</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app">
<div th:replace="~{fragments :: navbar}"></div>

<main class="container">
    <section class="panel">
        <h1>프로필 작성</h1>
        <p class="muted">팀원을 찾거나 지원할 때 다른 사람에게 보이는 정보입니다.</p>

        <p class="msg-error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/profile/edit}" method="post">
            <label for="department">학과</label>
            <input type="text" id="department" name="department" maxlength="50"
                   th:value="${profile?.department}" placeholder="예: 컴퓨터공학부" required>

            <label for="grade">학년</label>
            <select id="grade" name="grade">
                <option value="1" th:selected="${profile?.grade == 1}">1학년</option>
                <option value="2" th:selected="${profile?.grade == 2}">2학년</option>
                <option value="3" th:selected="${profile?.grade == 3}">3학년</option>
                <option value="4" th:selected="${profile?.grade == 4}">4학년</option>
            </select>

            <label>기술 태그 (여러 개 선택)</label>
            <div class="tag-grid">
                <label class="tag-check" th:each="tag : ${allTags}">
                    <input type="checkbox" name="tagIds" th:value="${tag.id}"
                           th:checked="${selectedTagIds.contains(tag.id)}">
                    <span th:text="${tag.name}">Java</span>
                </label>
            </div>

            <label for="intro">자기소개 (500자 이하)</label>
            <textarea id="intro" name="intro" rows="6" maxlength="500"
                      placeholder="관심 분야, 해본 프로젝트, 가능한 시간대 등을 적어 보세요."
                      th:text="${profile?.intro}"></textarea>

            <label for="githubUrl">GitHub 링크 (선택)</label>
            <input type="text" id="githubUrl" name="githubUrl" maxlength="200"
                   th:value="${profile?.githubUrl}" placeholder="https://github.com/아이디">

            <button type="submit" class="btn">저장</button>
        </form>
    </section>
</main>
</body>
</html>
