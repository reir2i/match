<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>모집글 | 팀 프로젝트 매칭</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body class="app">
<div th:replace="~{fragments :: navbar}"></div>

<main class="container">
    <section class="panel">
        <h1 th:text="${heading}">모집글 작성</h1>

        <p class="msg-error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{${formAction}}" method="post">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" maxlength="100"
                   th:value="${post?.title}" placeholder="예: 클라우드 컴퓨팅 팀 프로젝트 팀원 구해요" required>

            <label for="capacity">모집 인원 (1~20명)</label>
            <input type="number" id="capacity" name="capacity" min="1" max="20"
                   th:value="${post != null ? post.capacity : 3}" required>

            <label for="deadline">모집 마감일</label>
            <input type="date" id="deadline" name="deadline"
                   th:value="${post?.deadline}" th:min="${today}" required>

            <label>필요한 기술 태그 (여러 개 선택)</label>
            <div class="tag-grid">
                <label class="tag-check" th:each="tag : ${allTags}">
                    <input type="checkbox" name="tagIds" th:value="${tag.id}"
                           th:checked="${selectedTagIds.contains(tag.id)}">
                    <span th:text="${tag.name}">Java</span>
                </label>
            </div>

            <label for="content">내용 (2000자 이하)</label>
            <textarea id="content" name="content" rows="10" maxlength="2000"
                      placeholder="프로젝트 소개, 하려는 일, 원하는 팀원, 진행 방식 등을 적어 주세요."
                      th:text="${post?.content}" required></textarea>

            <button type="submit" class="btn">저장</button>
        </form>
    </section>
</main>
</body>
</html>
