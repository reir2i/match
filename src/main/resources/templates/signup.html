<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 팀 프로젝트 매칭</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <div class="brand">
        <span class="brand-icon">🤝</span>
        <span>팀 프로젝트 매칭</span>
    </div>

    <h1>회원가입</h1>
    <p class="sub">학번, 이름, 비밀번호를 입력하세요.</p>

    <p class="msg-error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/signup}" method="post">
        <label for="username">학번</label>
        <input type="text" id="username" name="username" placeholder="학번 입력" required autofocus>

        <label for="nickname">이름</label>
        <input type="text" id="nickname" name="nickname" placeholder="이름 입력" required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호 입력 (4자 이상)" required>

        <button type="submit" class="btn">가입하기</button>
    </form>

    <p class="link-row">이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
</div>
</body>
</html>
