<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>팀 프로젝트 매칭</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
    <style>
        .post-card.closed { opacity: 0.55; }

        .search-box {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin: 0 0 16px;
            padding: 16px 18px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
        }
        .search-box input[type="text"] {
            flex: 1 1 200px;
            width: auto;
            padding: 10px 14px;
            font-size: 15px;
        }
        .search-box select {
            flex: 0 1 160px;
            width: auto;
            padding: 10px 12px;
            font-size: 15px;
        }
        .search-box .check {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-size: 14px;
            white-space: nowrap;
        }
        .search-box .btn {
            width: auto;
            margin-top: 0;
            padding: 10px 20px;
            font-size: 15px;
        }
        .search-box .reset {
            font-size: 14px;
            color: #6b7280;
            text-decoration: none;
        }
        .result-count {
            margin: 0 0 12px;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>
<body class="app">
<div th:replace="~{fragments :: navbar}"></div>

<main class="container">
    <div th:if="${!hasProfile}" class="notice">
        <p>아직 프로필이 없습니다. 팀원을 찾거나 지원하려면 먼저 프로필을 작성하세요.</p>
        <a th:href="@{/profile/edit}" class="btn-link">프로필 작성하기</a>
    </div>

    <div class="board-head">
        <h1>팀원 모집</h1>
        <a th:href="@{/posts/new}" class="btn-link no-margin">모집글 작성</a>
    </div>

    <form class="search-box" th:action="@{/}" method="get">
        <input type="text" name="keyword" th:value="${keyword}" maxlength="50"
               placeholder="제목이나 내용으로 검색">

        <select name="tag">
            <option value="0">전체 태그</option>
            <option th:each="t : ${allTags}" th:value="${t.id}" th:text="${t.name}"
                    th:selected="${t.id == tagId}">Java</option>
        </select>

        <label class="check">
            <input type="checkbox" name="open" value="true" th:checked="${onlyOpen}"> 모집중만
        </label>

        <button type="submit" class="btn">검색</button>
        <a class="reset" th:if="${searching}" th:href="@{/}">초기화</a>
    </form>

    <p class="result-count" th:if="${searching}">
        검색 결과 <b th:text="${posts.totalElements}">0</b>건
    </p>

    <p th:if="${#lists.isEmpty(posts.content)}" class="muted empty"
       th:text="${searching} ? '조건에 맞는 모집글이 없습니다.' : '아직 모집글이 없습니다. 첫 모집글을 작성해 보세요.'">모집글이 없습니다.</p>

    <a class="post-card" th:each="post : ${posts.content}"
       th:classappend="${!post.recruiting} ? 'closed'"
       th:href="@{/posts/{id}(id=${post.id})}">
        <div class="post-top">
                <span th:class="${post.recruiting} ? 'badge badge-open' : 'badge badge-closed'"
                      th:text="${post.recruiting} ? '모집중' : '마감'">모집중</span>
            <span class="dday" th:if="${post.recruiting}" th:text="${post.ddayLabel}">D-3</span>
        </div>
        <h3 th:text="${post.title}">제목</h3>
        <div>
            <span class="chip" th:each="tag : ${post.tags}" th:text="${tag.name}">Java</span>
        </div>
        <div class="post-meta">
            <span th:text="${post.author.nickname}">작성자</span> ·
            <span>모집 <b th:text="${post.capacity}">3</b>명</span> ·
            <span th:text="${post.createdDate}">2026-11-23</span>
        </div>
    </a>

    <div class="pager" th:if="${posts.totalPages > 1}">
        <a th:if="${posts.hasPrevious()}"
           th:href="@{/(page=${posts.number - 1},keyword=${keyword},tag=${tagId},open=${onlyOpen})}">이전</a>
        <span th:text="${posts.number + 1} + ' / ' + ${posts.totalPages}">1 / 3</span>
        <a th:if="${posts.hasNext()}"
           th:href="@{/(page=${posts.number + 1},keyword=${keyword},tag=${tagId},open=${onlyOpen})}">다음</a>
    </div>
</main>
</body>
</html>
