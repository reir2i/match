<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 지원 | 팀 프로젝트 매칭</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
    <link rel="stylesheet" th:href="@{/css/apply.css}">
    <style>
        .section-title { margin: 28px 0 12px; font-size: 20px; }
        .room-card {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 16px 20px;
            background: #ffffff;
            border: 1px solid #c7c0f5;
            border-radius: 14px;
        }
        .room-card .room-title { flex: 1; font-weight: 600; }
        .room-card .room-title a { color: inherit; text-decoration: none; }
        .room-role {
            flex: none;
            padding: 4px 10px;
            border-radius: 999px;
            background: #ece9ff;
            color: #4c3dc4;
            font-size: 13px;
            font-weight: 600;
        }
        .room-card .btn-link { margin-top: 0; padding: 8px 16px; font-size: 14px; }
    </style>
</head>
<body class="app">
<div th:replace="~{fragments :: navbar}"></div>

<main class="container">
    <p class="msg-ok flash" th:if="${msg}" th:text="${msg}"></p>
    <p class="msg-error flash" th:if="${error}" th:text="${error}"></p>

    <div class="board-head">
        <h1>내 채팅방</h1>
    </div>

    <p class="muted empty" th:if="${#lists.isEmpty(rooms)}">
        아직 열린 채팅방이 없습니다. 모집이 마감되면 이곳에 생깁니다.
    </p>

    <div class="room-card" th:each="room : ${rooms}">
        <span class="room-role" th:text="${room.author.id == meId} ? '방장' : '참여'">방장</span>
        <span class="room-title">
                <a th:href="@{/posts/{id}(id=${room.id})}" th:text="${room.title}">모집글 제목</a>
            </span>
        <a th:href="@{/posts/{id}/chat(id=${room.id})}" class="btn-link">💬 채팅방 입장</a>
    </div>

    <h2 class="section-title">내 지원 현황</h2>

    <p class="muted empty" th:if="${#lists.isEmpty(applications)}">아직 지원한 모집글이 없습니다.</p>

    <div class="post-card static" th:each="app : ${applications}">
        <div class="post-top">
            <span th:class="'status ' + ${app.statusClass}" th:text="${app.statusLabel}">대기중</span>
            <span class="dday" th:text="${app.createdText}">2026-11-27 19:00</span>
        </div>
        <h3><a th:href="@{/posts/{id}(id=${app.post.id})}" th:text="${app.post.title}">제목</a></h3>
        <p class="post-meta">
            작성자 <span th:text="${app.post.author.nickname}">작성자</span> ·
            <span th:text="${app.post.recruiting} ? '모집중' : '마감'">모집중</span>
        </p>
        <p class="pre muted" th:if="${!#strings.isEmpty(app.message)}" th:text="${app.message}"></p>

        <form th:if="${app.pending}" th:action="@{/applications/{id}/cancel(id=${app.id})}" method="post">
            <button type="submit" class="btn-danger">지원 취소</button>
        </form>
    </div>
</main>
</body>
</html>
