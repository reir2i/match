<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>알림 | 팀 프로젝트 매칭</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
    <style>
        .noti {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 16px 20px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            color: inherit;
            text-decoration: none;
        }
        .noti:hover { border-color: #5b4bdb; }
        .noti.unread { background: #f3f1ff; border-color: #c7c0f5; }
        .noti-type {
            flex: none;
            padding: 4px 10px;
            border-radius: 999px;
            background: #ece9ff;
            color: #4c3dc4;
            font-size: 13px;
            font-weight: 600;
        }
        .noti-msg { flex: 1; }
        .noti.unread .noti-msg { font-weight: 600; }
        .noti-time { flex: none; font-size: 13px; color: #6b7280; }
        .read-all { margin: 0; }
        .read-all .btn { margin-top: 0; }
    </style>
</head>
<body class="app">
<div th:replace="~{fragments :: navbar}"></div>

<main class="container">
    <div class="board-head">
        <h1>알림</h1>
        <form class="read-all" th:action="@{/notifications/read-all}" method="post"
              th:if="${unreadCount > 0}">
            <button type="submit" class="btn btn-sm">모두 읽음</button>
        </form>
    </div>

    <p class="muted empty" th:if="${#lists.isEmpty(notifications)}">알림이 없습니다.</p>

    <a class="noti" th:each="n : ${notifications}"
       th:classappend="${!n.checked} ? 'unread'"
       th:href="@{/notifications/{id}/go(id=${n.id})}">
        <span class="noti-type" th:text="${n.typeLabel}">지원</span>
        <span class="noti-msg" th:text="${n.message}">알림 내용</span>
        <span class="noti-time" th:text="${n.createdText}">2026-11-28 10:00</span>
    </a>
</main>
</body>
</html>
